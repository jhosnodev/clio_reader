appId: com.echo-reader.desktop
productName: Echo Reader
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  sign: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  allowElevation: true
