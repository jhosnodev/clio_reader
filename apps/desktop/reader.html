<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="reader.documentTitle">Lector — Clio</title>
    <link rel="stylesheet" href="/src/reader.css" />
  </head>
  <body>
    <section class="reader" id="reader" data-theme="paper" data-font="serif" aria-hidden="true">
      <!-- toolbar -->
      <header class="r-bar" id="r-bar">
        <button
          class="r-btn"
          id="r-back"
          title="Volver a la biblioteca"
          data-i18n-title="reader.back"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <div class="r-title" id="r-title">
          <span data-i18n="reader.titlePlaceholder">Título</span
          ><small id="r-author" data-i18n="reader.authorPlaceholder">Autor</small>
        </div>
        <div style="flex: 1"></div>
        <div class="r-tools">
          <button
            class="r-btn"
            data-panel="info"
            title="Información"
            data-i18n-title="reader.panel.info"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" />
            </svg>
          </button>
          <button class="r-btn" data-panel="toc" title="Índice" data-i18n-title="reader.panel.toc">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 6h12M8 12h12M8 18h12" />
              <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
            </svg>
          </button>
          <button
            class="r-btn"
            data-panel="search"
            title="Buscar en el documento"
            data-i18n-title="reader.panel.searchDoc"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </button>
          <button
            class="r-btn"
            data-panel="notes"
            title="Notas"
            data-i18n-title="reader.panel.notes"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 5h16v11l-4 4H4z" />
              <path d="M16 20v-4h4" />
              <path d="M8 9h8M8 13h5" />
            </svg>
          </button>
          <!-- TODO: marcadores no funcional — re-habilitar cuando el CRUD esté completo
          <button class="r-btn" id="r-mark" title="Añadir marcador">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 4h12v16l-6-4-6 4z" />
            </svg>
          </button>
          -->

          <span class="r-sep"></span>
          <button
            class="r-btn"
            data-panel="settings"
            title="Ajustes de lectura"
            data-i18n-title="reader.panel.settings"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
              <circle cx="16" cy="7" r="2.3" />
              <circle cx="8" cy="17" r="2.3" />
            </svg>
          </button>
          <button class="r-btn" id="r-zen" title="Modo Zen" data-i18n-title="reader.zen">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- zona de lectura -->
      <div class="r-scroll" id="r-scroll">
        <button
          class="zen-exit"
          id="zen-exit"
          title="Salir de Zen"
          data-i18n-title="reader.zenExit"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <article class="page" id="page"></article>
      </div>

      <!-- navegación inferior -->
      <footer class="r-foot" id="r-foot">
        <button class="pg-btn" id="prev-page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 6l-6 6 6 6" /></svg
          ><span data-i18n="reader.prev">Anterior</span>
        </button>
        <div class="r-progress">
          <div
            class="track"
            id="track"
            role="slider"
            tabindex="0"
            aria-label="Progreso de lectura"
            data-i18n-aria="reader.progressAria"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-valuetext="Cap. 1"
          >
            <i id="track-fill"></i>
          </div>
          <span class="pct" id="pct">Cap. 1</span>
        </div>
        <button class="pg-btn" id="next-page">
          <span data-i18n="reader.next">Siguiente</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
      </footer>

      <!-- widget de selección: resaltar color o añadir nota -->
      <div
        class="sel-widget"
        id="sel-widget"
        hidden
        role="toolbar"
        aria-label="Acciones sobre el texto seleccionado"
        data-i18n-aria="reader.selectionAria"
      >
        <div class="sel-colors" id="sel-colors">
          <button
            class="sel-color"
            data-color="#facc15"
            title="Amarillo"
            aria-label="Amarillo"
            data-i18n-title="reader.color.yellow"
            data-i18n-aria="reader.color.yellow"
          ></button>
          <button
            class="sel-color"
            data-color="#4ade80"
            title="Verde"
            aria-label="Verde"
            data-i18n-title="reader.color.green"
            data-i18n-aria="reader.color.green"
          ></button>
          <button
            class="sel-color"
            data-color="#38bdf8"
            title="Azul"
            aria-label="Azul"
            data-i18n-title="reader.color.blue"
            data-i18n-aria="reader.color.blue"
          ></button>
          <button
            class="sel-color"
            data-color="#f472b6"
            title="Rosa"
            aria-label="Rosa"
            data-i18n-title="reader.color.pink"
            data-i18n-aria="reader.color.pink"
          ></button>
          <button
            class="sel-color"
            data-color="#fb923c"
            title="Naranja"
            aria-label="Naranja"
            data-i18n-title="reader.color.orange"
            data-i18n-aria="reader.color.orange"
          ></button>
          <button
            class="sel-color"
            data-color="#c084fc"
            title="Morado"
            aria-label="Morado"
            data-i18n-title="reader.color.purple"
            data-i18n-aria="reader.color.purple"
          ></button>
        </div>
        <span class="sel-sep" aria-hidden="true"></span>
        <button
          class="sel-act"
          id="sel-note"
          title="Añadir una nota"
          data-i18n-title="reader.addNote"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z" />
            <path d="M13.5 6.5l3 3" />
          </svg>
        </button>
        <button
          class="sel-act sel-danger"
          id="sel-delete"
          title="Eliminar resaltado"
          data-i18n-title="reader.deleteHighlight"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 10v7M14 10v7" />
          </svg>
        </button>
      </div>

      <!-- toast -->
      <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z" /></svg>
        <span id="toast-tx" data-i18n="reader.bookmark.added">Marcador añadido</span>
      </div>

      <!-- drawer -->
      <div class="drawer-scrim" id="scrim"></div>
      <aside class="drawer" id="drawer">
        <div class="drawer-head">
          <h3 id="drawer-title" data-i18n="reader.panel.toc">Índice</h3>
          <button class="x" id="drawer-x">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="drawer-body">
          <!-- índice -->
          <div class="panel" id="panel-toc"></div>
          <!-- buscar -->
          <div class="panel" id="panel-search">
            <div class="dsearch">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="doc-search"
                placeholder="Buscar palabra o frase…"
                data-i18n-placeholder="reader.searchPlaceholder"
              />
            </div>
            <div id="doc-results"></div>
          </div>
          <!-- notas -->
          <div class="panel" id="panel-notes">
            <div class="note-quote" id="note-quote"></div>
            <textarea
              class="note-add"
              id="note-input"
              placeholder="Selecciona un texto para anclar la nota, o escribe una nota de página…"
              data-i18n-placeholder="reader.notePlaceholder"
            ></textarea>
            <button class="note-save" id="note-save" data-i18n="reader.saveNote">
              Guardar nota
            </button>
            <div id="notes-list"></div>
          </div>
          <!-- info -->
          <div class="panel" id="panel-info"></div>
          <!-- ajustes de lectura -->
          <div class="panel" id="panel-settings">
            <div class="set-group">
              <label data-i18n="reader.settings.theme">Tema</label>
              <div class="swatches" id="sw-theme">
                <button
                  class="sw sel"
                  data-t="paper"
                  title="Papel"
                  data-i18n-title="reader.settings.paper"
                ></button>
                <button
                  class="sw"
                  data-t="sepia"
                  title="Sepia"
                  data-i18n-title="reader.settings.sepia"
                ></button>
                <button
                  class="sw"
                  data-t="night"
                  title="Noche"
                  data-i18n-title="reader.settings.night"
                ></button>
              </div>
            </div>
            <div class="set-group">
              <label data-i18n="reader.settings.typography">Tipografía</label>
              <div class="seg" id="sw-font">
                <button class="sel" data-f="serif">Serif</button>
                <button data-f="sans">Sans</button>
              </div>
            </div>
            <div class="set-group">
              <label data-i18n="reader.settings.fontSize">Tamaño de letra</label>
              <div class="stepper">
                <button id="size-down">−</button>
                <span class="val" id="size-val">19 px</span>
                <button id="size-up">+</button>
              </div>
            </div>
            <div class="set-group">
              <label data-i18n="reader.settings.lineHeight">Interlineado</label>
              <div class="seg" id="sw-lh">
                <button data-lh="1.55" data-i18n="reader.settings.compact">Compacto</button>
                <button class="sel" data-lh="1.75" data-i18n="reader.settings.normal">
                  Normal
                </button>
                <button data-lh="2" data-i18n="reader.settings.wide">Amplio</button>
              </div>
            </div>
            <div class="set-group">
              <label for="margin-range">
                <span data-i18n="reader.settings.margins">Márgenes</span>
                <span class="val" id="margin-val">48 px</span>
              </label>
              <div class="margin-control">
                <span data-i18n="reader.settings.narrow">Angostos</span>
                <input
                  type="range"
                  id="margin-range"
                  min="8"
                  max="120"
                  step="2"
                  value="48"
                  aria-label="Margen de lectura"
                  data-i18n-aria="reader.settings.marginAria"
                />
                <span data-i18n="reader.settings.broad">Amplios</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- loading / error (overlay dentro del reader) -->
      <div class="reader-overlay" id="reader-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p data-i18n="reader.loading">Cargando libro…</p>
      </div>
      <div class="reader-overlay" id="reader-error" style="display: none" role="alert">
        <p id="reader-error-message"></p>
        <div class="reader-error-actions">
          <button id="reader-error-retry" class="r-action-btn" data-i18n="reader.retry">
            Reintentar
          </button>
          <button id="reader-error-back" class="r-action-btn" data-i18n="reader.backToLibrary">
            Volver a la biblioteca
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/reader-entry.ts"></script>
  </body>
</html>
