<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector — Clio</title>
    <link rel="stylesheet" href="/src/reader.css" />
  </head>
  <body>
    <section class="reader" id="reader" data-theme="paper" data-font="serif" aria-hidden="true">
      <!-- toolbar -->
      <header class="r-bar" id="r-bar">
        <button class="r-btn" id="r-back" title="Volver a la biblioteca">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <div class="r-title" id="r-title">Título<small id="r-author">Autor</small></div>
        <div style="flex: 1"></div>
        <div class="r-tools">
          <button class="r-btn" data-panel="info" title="Información">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" />
            </svg>
          </button>
          <button class="r-btn" data-panel="toc" title="Índice">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 6h12M8 12h12M8 18h12" />
              <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
            </svg>
          </button>
          <button class="r-btn" data-panel="search" title="Buscar en el documento">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </button>
          <button class="r-btn" data-panel="notes" title="Notas">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 5h16v11l-4 4H4z" />
              <path d="M16 20v-4h4" />
              <path d="M8 9h8M8 13h5" />
            </svg>
          </button>
          <button class="r-btn" id="r-mark" title="Añadir marcador">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 4h12v16l-6-4-6 4z" />
            </svg>
          </button>
          <span class="r-sep"></span>
          <button class="r-btn" data-panel="settings" title="Ajustes de lectura">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
              <circle cx="16" cy="7" r="2.3" />
              <circle cx="8" cy="17" r="2.3" />
            </svg>
          </button>
          <button class="r-btn" id="r-zen" title="Modo Zen">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- zona de lectura -->
      <div class="r-scroll" id="r-scroll">
        <button class="zen-exit" id="zen-exit" title="Salir de Zen">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <article class="page" id="page"></article>
      </div>

      <!-- navegación inferior -->
      <footer class="r-foot" id="r-foot">
        <button class="pg-btn" id="prev-page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 6l-6 6 6 6" /></svg
          >Anterior
        </button>
        <div class="r-progress">
          <div
            class="track"
            id="track"
            role="slider"
            tabindex="0"
            aria-label="Progreso de lectura"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-valuetext="Cap. 1"
          >
            <i id="track-fill"></i>
          </div>
          <span class="pct" id="pct">Cap. 1</span>
        </div>
        <button class="pg-btn" id="next-page">
          Siguiente
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
      </footer>

      <!-- widget de selección: resaltar color o añadir nota -->
      <div
        class="sel-widget"
        id="sel-widget"
        hidden
        role="toolbar"
        aria-label="Acciones sobre el texto seleccionado"
      >
        <div class="sel-colors" id="sel-colors">
          <button
            class="sel-color"
            data-color="#facc15"
            title="Amarillo"
            aria-label="Amarillo"
          ></button>
          <button class="sel-color" data-color="#4ade80" title="Verde" aria-label="Verde"></button>
          <button class="sel-color" data-color="#38bdf8" title="Azul" aria-label="Azul"></button>
          <button class="sel-color" data-color="#f472b6" title="Rosa" aria-label="Rosa"></button>
          <button
            class="sel-color"
            data-color="#fb923c"
            title="Naranja"
            aria-label="Naranja"
          ></button>
          <button
            class="sel-color"
            data-color="#c084fc"
            title="Morado"
            aria-label="Morado"
          ></button>
        </div>
        <span class="sel-sep" aria-hidden="true"></span>
        <button class="sel-act" id="sel-note" title="Añadir una nota">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z" />
            <path d="M13.5 6.5l3 3" />
          </svg>
        </button>
        <button class="sel-act sel-danger" id="sel-delete" title="Eliminar resaltado" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 10v7M14 10v7" />
          </svg>
        </button>
      </div>

      <!-- toast -->
      <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z" /></svg>
        <span id="toast-tx">Marcador añadido</span>
      </div>

      <!-- drawer -->
      <div class="drawer-scrim" id="scrim"></div>
      <aside class="drawer" id="drawer">
        <div class="drawer-head">
          <h3 id="drawer-title">Índice</h3>
          <button class="x" id="drawer-x">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="drawer-body">
          <!-- índice -->
          <div class="panel" id="panel-toc"></div>
          <!-- buscar -->
          <div class="panel" id="panel-search">
            <div class="dsearch">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input id="doc-search" placeholder="Buscar palabra o frase…" />
            </div>
            <div id="doc-results"></div>
          </div>
          <!-- notas -->
          <div class="panel" id="panel-notes">
            <div class="note-quote" id="note-quote"></div>
            <textarea
              class="note-add"
              id="note-input"
              placeholder="Selecciona un texto para anclar la nota, o escribe una nota de página…"
            ></textarea>
            <button class="note-save" id="note-save">Guardar nota</button>
            <div id="notes-list"></div>
          </div>
          <!-- info -->
          <div class="panel" id="panel-info"></div>
          <!-- ajustes de lectura -->
          <div class="panel" id="panel-settings">
            <div class="set-group">
              <label>Tema</label>
              <div class="swatches" id="sw-theme">
                <button class="sw sel" data-t="paper" title="Papel"></button>
                <button class="sw" data-t="sepia" title="Sepia"></button>
                <button class="sw" data-t="night" title="Noche"></button>
              </div>
            </div>
            <div class="set-group">
              <label>Tipografía</label>
              <div class="seg" id="sw-font">
                <button class="sel" data-f="serif">Serif</button>
                <button data-f="sans">Sans</button>
              </div>
            </div>
            <div class="set-group">
              <label>Tamaño de letra</label>
              <div class="stepper">
                <button id="size-down">−</button>
                <span class="val" id="size-val">19 px</span>
                <button id="size-up">+</button>
              </div>
            </div>
            <div class="set-group">
              <label>Interlineado</label>
              <div class="seg" id="sw-lh">
                <button data-lh="1.55">Compacto</button>
                <button class="sel" data-lh="1.75">Normal</button>
                <button data-lh="2">Amplio</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- loading / error (overlay dentro del reader) -->
      <div class="reader-overlay" id="reader-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Cargando libro…</p>
      </div>
      <div class="reader-overlay" id="reader-error" style="display: none" role="alert">
        <p id="reader-error-message"></p>
        <div class="reader-error-actions">
          <button id="reader-error-retry" class="r-action-btn">Reintentar</button>
          <button id="reader-error-back" class="r-action-btn">Volver a la biblioteca</button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/reader-entry.ts"></script>
  </body>
</html>
